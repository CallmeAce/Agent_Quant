version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: openclaw_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openclaw_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openclaw} -d ${POSTGRES_DB:-quant_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management (optional, comment out if not needed)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openclaw_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@openclaw.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  # Openclaw Bot Service
  bot:
    build: .
    container_name: openclaw_bot
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://openclaw:openclaw_dev@db:5432/quant_db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Shanghai}
      # Proxy configuration for Telegram API (through host)
      HTTPS_PROXY: http://host.docker.internal:7897
      HTTP_PROXY: http://host.docker.internal:7897
      NO_PROXY: db,pgadmin,api,scheduler,localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./etl:/app/etl:ro
    depends_on:
      db:
        condition: service_healthy
    command: python -m etl.bot

  # Scheduler Service (for ETL jobs)
  scheduler:
    build: .
    container_name: openclaw_scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://openclaw:openclaw_dev@db:5432/quant_db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      QMT_ACCOUNT_IDS: ${QMT_ACCOUNT_IDS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./logs:/app/logs
      - ./etl:/app/etl:ro
    depends_on:
      - db
      - bot
    command: >
      python -m etl.scheduler

  # FastAPI Backend (optional, for web dashboard)
  api:
    build: .
    container_name: openclaw_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://openclaw:openclaw_dev@db:5432/quant_db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
    command: uvicorn etl.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  pgadmin_data:

networks:
  default:
    name: openclaw_network
