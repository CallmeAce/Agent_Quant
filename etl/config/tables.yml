#
# Centralised table and field contracts for ETL.
# This file mirrors the high‑level definitions in docs/data_contracts.md
# and should be kept in sync when schemas evolve.
#

dim_security:
  primary_key: [security_id]
  fields:
    security_id: STRING
    ts_code: STRING
    qmt_code: STRING
    symbol: STRING
    name: STRING
    exchange: STRING
    security_type: STRING
    list_date: DATE
    delist_date: DATE
    status: STRING
    currency: STRING
    lot_size: INT
    created_at: DATETIME
    updated_at: DATETIME

ods_daily_bar:
  primary_key: [security_id, trade_date]
  fields:
    security_id: STRING
    trade_date: DATE
    open: DECIMAL(18,4)
    high: DECIMAL(18,4)
    low: DECIMAL(18,4)
    close: DECIMAL(18,4)
    pre_close: DECIMAL(18,4)
    change: DECIMAL(18,4)
    pct_change: DECIMAL(10,4)
    vol: DECIMAL(20,2)
    amount: DECIMAL(20,4)
    adj_factor: DECIMAL(18,8)
    source: STRING
    ingest_batch_id: STRING
    updated_at: DATETIME

ods_financial_statement:
  primary_key: [security_id, report_period, statement_type]
  fields:
    security_id: STRING
    report_period: DATE
    announce_date: DATE
    statement_type: STRING
    fiscal_year: INT
    fiscal_quarter: INT
    total_revenue: DECIMAL(20,4)
    net_profit: DECIMAL(20,4)
    total_assets: DECIMAL(20,4)
    total_liabilities: DECIMAL(20,4)
    total_equity: DECIMAL(20,4)
    operating_cashflow: DECIMAL(20,4)
    roe: DECIMAL(10,4)
    roa: DECIMAL(10,4)
    gross_margin: DECIMAL(10,4)
    net_margin: DECIMAL(10,4)
    eps: DECIMAL(10,4)
    revenue_yoy: DECIMAL(10,4)
    net_profit_yoy: DECIMAL(10,4)
    source: STRING
    ingest_batch_id: STRING
    updated_at: DATETIME

ods_account_equity_daily:
  primary_key: [account_id, trade_date]
  fields:
    account_id: STRING
    trade_date: DATE
    total_equity: DECIMAL(20,4)
    cash: DECIMAL(20,4)
    frozen_cash: DECIMAL(20,4)
    market_value: DECIMAL(20,4)
    available_funds: DECIMAL(20,4)
    leverage_ratio: DECIMAL(10,4)
    source: STRING
    ingest_batch_id: STRING
    updated_at: DATETIME

ods_position_snapshot:
  primary_key: [account_id, security_id, snapshot_time]
  fields:
    account_id: STRING
    security_id: STRING
    snapshot_time: DATETIME
    quantity: DECIMAL(20,4)
    available_qty: DECIMAL(20,4)
    avg_cost: DECIMAL(18,4)
    market_price: DECIMAL(18,4)
    market_value: DECIMAL(20,4)
    unrealized_pnl: DECIMAL(20,4)
    realized_pnl_daily: DECIMAL(20,4)
    source: STRING
    ingest_batch_id: STRING
    updated_at: DATETIME

ods_trade:
  primary_key: [trade_id]
  fields:
    trade_id: STRING
    order_id: STRING
    account_id: STRING
    security_id: STRING
    trade_time: DATETIME
    side: STRING
    price: DECIMAL(18,4)
    quantity: DECIMAL(20,4)
    amount: DECIMAL(20,4)
    fee: DECIMAL(18,4)
    tax: DECIMAL(18,4)
    source: STRING
    ingest_batch_id: STRING
    updated_at: DATETIME

dwd_factor_value:
  primary_key: [security_id, trade_date, factor_id]
  fields:
    security_id: STRING
    trade_date: DATE
    factor_id: STRING
    factor_value: DECIMAL(20,6)
    value_type: STRING
    calc_version: STRING
    source: STRING
    updated_at: DATETIME

dim_trade_calendar:
  primary_key: [exchange, trade_date]
  fields:
    exchange: STRING
    trade_date: DATE
    is_trading_day: INT
    previous_trading_date: DATE

ods_daily_basic:
  primary_key: [security_id, trade_date]
  fields:
    security_id: STRING
    trade_date: DATE
    close: DECIMAL(18,4)
    turnover_rate: DECIMAL(10,4)
    turnover_rate_f: DECIMAL(10,4)
    volume_ratio: DECIMAL(10,4)
    pe: DECIMAL(18,6)
    pe_ttm: DECIMAL(18,6)
    pb: DECIMAL(18,6)
    ps: DECIMAL(18,6)
    ps_ttm: DECIMAL(18,6)
    dv_ratio: DECIMAL(10,4)
    dv_ttm: DECIMAL(10,4)
    total_share: DECIMAL(20,4)
    float_share: DECIMAL(20,4)
    total_mv: DECIMAL(20,4)
    circ_mv: DECIMAL(20,4)
    source: STRING
    ingest_batch_id: STRING
    updated_at: DATETIME

ods_index_daily:
  primary_key: [index_id, trade_date]
  fields:
    index_id: STRING
    trade_date: DATE
    open: DECIMAL(18,4)
    high: DECIMAL(18,4)
    low: DECIMAL(18,4)
    close: DECIMAL(18,4)
    pre_close: DECIMAL(18,4)
    pct_change: DECIMAL(10,4)
    vol: DECIMAL(20,2)
    amount: DECIMAL(20,4)
    source: STRING
    ingest_batch_id: STRING
    updated_at: DATETIME

dm_strategy_signal:
  primary_key: [strategy_id, security_id, signal_time, signal_type]
  fields:
    strategy_id: STRING
    security_id: STRING
    signal_time: DATETIME
    signal_type: STRING
    direction: STRING
    target_weight: DECIMAL(10,4)
    price_hint_min: DECIMAL(18,4)
    price_hint_max: DECIMAL(18,4)
    valid_from: DATETIME
    valid_to: DATETIME
    comment: STRING
    source: STRING
    created_at: DATETIME

dwd_backtest_run:
  primary_key: [run_id]
  fields:
    run_id: STRING
    strategy_id: STRING
    start_date: DATE
    end_date: DATE
    benchmark_index: STRING
    cost_bps: DECIMAL(10,4)
    params: STRING
    created_at: DATETIME

dwd_backtest_metrics:
  primary_key: [run_id]
  fields:
    run_id: STRING
    total_return: DECIMAL(12,6)
    annual_return: DECIMAL(12,6)
    sharpe: DECIMAL(12,6)
    max_drawdown: DECIMAL(12,6)
    win_rate: DECIMAL(12,6)
    turnover: DECIMAL(12,6)
    benchmark_return: DECIMAL(12,6)
    created_at: DATETIME

dwd_strategy_nav:
  primary_key: [run_id, trade_date]
  fields:
    run_id: STRING
    trade_date: DATE
    nav: DECIMAL(18,8)
    benchmark_nav: DECIMAL(18,8)

dwd_strategy_position:
  primary_key: [run_id, security_id, trade_date]
  fields:
    run_id: STRING
    security_id: STRING
    trade_date: DATE
    weight: DECIMAL(10,6)

