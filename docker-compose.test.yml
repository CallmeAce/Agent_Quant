# Minimal Docker Compose for testing Openclaw Bot
# Only includes database and bot services

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: openclaw_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openclaw_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quant_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openclaw} -d ${POSTGRES_DB:-quant_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Openclaw Bot Service
  bot:
    build: .
    container_name: openclaw_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://openclaw:openclaw_dev@db:5432/quant_db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy
    command: python -m etl.bot

volumes:
  postgres_data:
